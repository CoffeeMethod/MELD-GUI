[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meld-gui"
version = "1.0.0"
description = "A local web interface for the MELD AI-generated text detector"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.48",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
documents = ["pypdf>=4.0", "python-docx>=1.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
meld-gui = "meld_gui.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["meld_gui*"]

[tool.setuptools.package-data]
meld_gui = ["web/templates/*.html", "web/static/css/*.css", "web/static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: requires the MELD checkpoint to be downloaded (~1.6 GB)",
]
filterwarnings = ["ignore::DeprecationWarning"]
